[package]
name = "example_plugin_panel"
version = "0.1.0"
edition = "2021"
description = "Example Open CAD Studio add-on demonstrating a dockable side panel with live control events."
license = "GPL-3.0-only"

[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# Path into the sibling OpenCADStudio checkout (the sync-to-windows flow
# mirrors both repos side by side, so this path resolves on the WSL source
# of truth and on the C:\work\opencode build mirror alike).
# Codec types are re-exported by ocs_plugin_api as `acadrust` so the plugin
# and the host share one type identity — never add an acadrust git dependency
# here (it would create mismatching types instead of an ABI check).
ocs_plugin_api = { path = "../OpenCADStudio/crates/ocs_plugin_api", features = ["host"] }
