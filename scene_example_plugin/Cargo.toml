[package]
name = "scene_example_plugin"
version = "0.1.0"
edition = "2021"
description = "Example Open CAD Studio add-on demonstrating the API v24 scene/widget wire: publish-or-patch panels, typed tables, and stale-base recovery."
license = "GPL-3.0-only"

# Standalone workspace root, exactly like the sibling `example_plugin_panel`
# crate: each example package self-scopes (`[workspace]` with no members) so
# the two cdylibs stay independent builds that both anchor the same
# path-resolved `ocs_plugin_api`.
[workspace]

[lib]
crate-type = ["cdylib"]

[dependencies]
# Path into the sibling OpenCADStudio checkout (the sync-to-windows flow
# mirrors both repos side by side, so this path resolves on the WSL source
# of truth and on the C:\work\opencode build mirror alike).
# API major comes from the same crate the host builds against: this checkout
# is at the API-24 tip, so the compiled cdylib reports v24 and can decode the
# v24 scene/widget wire.
ocs_plugin_api = { path = "../../OpenCADStudio/crates/ocs_plugin_api", features = ["host"] }

[dev-dependencies]
# Test-only: the wire serializer (the same 1.3.x line the api crate's own
# wire tests pin with) for the byte-determinism / patch-minimality proofs.
bincode = "1"
